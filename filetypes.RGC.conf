# RGC filetype configuration for Geany

[styling=C]

[keywords]
primary=if elif else for in while break continue pass return match case from public def class enum interface import and or not self True False None
secondary=int float bool str print range to_string args read_file write_file system len

docComment=TODO FIXME XXX HACK NOTE

[lexer_properties=C]

[settings]
lexer_filetype=C
extension=rg
comment_single=#
comment_open=/*
comment_close=*/
comment_use_indent=true
tag_parser=C
mime_type=text/x-rgc

[indentation]
width=4
type=0

[build_settings]
error_regex=([^:]+):([0-9]+):([0-9]+): (?:error|warning):
FT_00_LB=_Compile
FT_00_CM=rgc "%f" -o "%e"
FT_00_WD=
FT_01_LB=_Run
FT_01_CM=rgc run "%f"
FT_01_WD=
FT_02_LB=_Test
FT_02_CM=rgc test "%f"
FT_02_WD=